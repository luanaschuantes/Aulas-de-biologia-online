<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BioMentoria - Contato</title>


<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    html,
    body {
        min-height: 100%;
    }


    body {

        font-family: 'Segoe UI', Arial, sans-serif;

        background: #f7faf9;

        color: #374151;

        display: flex;

        flex-direction: column;

        min-height: 100vh;

    }


    /* MENU */

    nav {

        width: 100%;

        background: #06402f;

        padding: 20px 5%;

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 35px;

        position: sticky;

        top: 0;

        z-index: 999;

        box-shadow: 0 5px 20px rgba(0,0,0,.15);

    }


    nav a {

        color: white;

        text-decoration: none;

        font-weight: 600;

        font-size: 17px;

        transition: .3s;

    }


    nav a:hover {

        color: #80ffd2;

    }


    /* BANNER */

    .banner {

        width: 100%;

        min-height: 380px;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        text-align: center;

        padding: 70px 20px;

        color: white;

        background:

            linear-gradient(

                rgba(6,64,47,.65),

                rgba(6,64,47,.65)

            ),

            url("./fundo.jpg");

        background-size: cover;

        background-position: center;

    }


    .banner h1 {

        font-size: clamp(45px, 7vw, 70px);

        font-weight: 900;

        letter-spacing: 2px;

        margin-bottom: 15px;

    }


    .banner p {

        color: white;

        font-size: 24px;

        max-width: 850px;

        line-height: 1.5;

        text-shadow: 0 3px 8px rgba(0,0,0,.5);

    }


    /* CONTAINER */

    .container {

        width: 90%;

        max-width: 1000px;

        margin: auto;

        flex: 1;

    }


    /* CARDS */

    .card {

        background: white;

        margin: 35px 0;

        padding: 35px;

        border-radius: 20px;

        box-shadow: 0 8px 25px rgba(0,0,0,.08);

    }


    .card h2 {

        color: #06402f;

        font-size: 30px;

        margin-bottom: 20px;

    }


    .card h3 {

        color: #06402f;

        margin-top: 20px;

        margin-bottom: 8px;

    }


    .card p {

        font-size: 18px;

        line-height: 1.8;

        margin-bottom: 12px;

    }


    .card li {

        margin: 14px 0;

        font-size: 17px;

        line-height: 1.5;

    }


    /* BOTÕES */

    .btn {

        background: #06402f;

        color: white;

        border: none;

        padding: 16px 30px;

        border-radius: 50px;

        cursor: pointer;

        font-weight: bold;

        text-decoration: none;

        display: inline-block;

        margin: 5px;

        transition: .3s;

    }


    .btn:hover {

        background: #087052;

        transform: translateY(-3px);

    }


    /* DESTAQUE WHATSAPP */

    .whatsapp {

        border-left: 6px solid #25D366;

    }


    .whatsapp h2 {

        color: #075E54;

    }


    /* RODAPÉ */

    footer {

        margin-top: auto;

        background: #03251c;

        color: white;

        text-align: center;

        padding: 30px;

        width: 100%;

    }


    /* RESPONSIVO */

    @media (max-width: 768px) {

        nav {

            flex-direction: column;

            gap: 15px;

        }


        .banner {

            min-height: 350px;

        }


        .banner h1 {

            font-size: 42px;

        }


        .banner p {

            font-size: 18px;

        }


        .card {

            padding: 25px;

        }


        .card h2 {

            font-size: 27px;

        }


        .btn {

            width: 100%;

            text-align: center;

            margin: 5px 0;

        }

    }

</style>
