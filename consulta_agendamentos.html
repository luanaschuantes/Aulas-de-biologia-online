<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BioMentoria - Contato</title>

<link
    rel="stylesheet"
    href="estilo.css"
>

<style>

    .contato-area {

        max-width: 800px;

        margin: 60px auto;

        text-align: center;

    }

    .contato-area h2 {

        margin-bottom: 20px;

    }

    .contato-area p {

        margin-bottom: 25px;

    }

    .whatsapp-card {

        background: #e9f8f1;

        border-radius: 25px;

        padding: 45px 30px;

        margin-top: 30px;

        box-shadow: 0 10px 30px rgba(0,0,0,.08);

    }

    .whatsapp-icon {

        font-size: 60px;

        margin-bottom: 15px;

    }

    .numero {

        font-size: 22px;

        font-weight: bold;

        color: #06402f;

        margin: 20px 0;

    }

    .whatsapp-btn {

        background: #25D366;

        color: white;

        padding: 16px 35px;

        border-radius: 50px;

        text-decoration: none;

        font-weight: bold;

        display: inline-block;

        transition: .3s;

    }

    .whatsapp-btn:hover {

        background: #1ebe5d;

        transform: translateY(-3px);

    }

    .horario {

        margin-top: 30px;

        color: #555;

    }

</style>
