<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matrícula - Curso de Biologia</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

<header>

    <h1>Curso de Biologia</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="matricula.html">Matrícula</a>
        <a href="servicos.html">Planos</a>
        <a href="agendamentos.html">Aulas</a>
        <a href="consulta_agendamentos.html">Contato</a>
        <a href="login.html">Entrar</a>
    </nav>

</header>


<main class="container">

<section class="card">

<h2>Faça sua matrícula</h2>

<p>
Cadastre-se para ter acesso às aulas de Biologia.
</p>


<form action="/salvar-cliente" method="POST">


<label>
Nome completo:
</label>

<input 
type="text" 
name="nome"
placeholder="Digite seu nome"
required
>



<label>
CPF:
</label>

<input 
type="text" 
name="cpf"
placeholder="Digite seu CPF"
>



<label>
Telefone:
</label>

<input 
type="text" 
name="telefone"
placeholder="Digite seu telefone"
>



<label>
E-mail:
</label>

<input 
type="email"
name="email"
placeholder="Digite seu e-mail"
required
>



<label>
Senha:
</label>

<input 
type="password"
name="senha"
placeholder="Crie uma senha"
required
>



<label>
Escolha seu plano:
</label>


<select name="plano" required>


<option value="">
Selecione um plano
</option>


<option value="Basico">
Plano Básico - Vídeos + Quizzes
</option>


<option value="Intermediario">
Plano Intermediário - PDFs + Quizzes
</option>


<option value="Premium">
Plano Premium - Vídeos + PDFs + Quizzes
</option>


</select>



<br><br>


<button type="submit">
Realizar Matrícula
</button>


</form>


</section>


</main>


<footer>

<p>
Curso de Biologia - Todos os direitos reservados
</p>

</footer>


</body>

</html>
