<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="estilo.css">

    <title>BioMentoria - Matrícula</title>

</head>

<body>

<nav>

    <a href="index.html">Início</a>

    <a href="clientes.html">Matrícula</a>

    <a href="servicos.html">Planos</a>

    <a href="agendamentos.html">Conteúdos</a>

    <a href="consulta_agendamentos.html">Contato</a>

</nav>

<header class="banner">

    <h1>Matrícula de Alunos</h1>

    <p>
        Cadastre-se para ter acesso aos conteúdos de Biologia
    </p>

</header>

<div class="container">

    <div class="card">

        <h2>Cadastro do Aluno</h2>

        <p>
            Preencha seus dados abaixo para realizar sua
            matrícula na BioMentoria.
        </p>

        <form action="/salvar-cliente" method="POST">

            <label for="nome">
                Nome completo:
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome completo"
                required
            >

            <label for="cpf">
                CPF:
            </label>

            <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="Digite seu CPF"
            >

            <label for="telefone">
                Telefone:
            </label>

            <input
                type="text"
                id="telefone"
                name="telefone"
                placeholder="Digite seu telefone"
            >

            <label for="email">
                E-mail:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="plano">
                Escolha seu plano:
            </label>

            <select
                id="plano"
                name="plano"
                required
            >

                <option value="">
                    Selecione um plano...
                </option>

                <option value="basico">
                    Básico - R$20 (3 meses)
                </option>

                <option value="intermediario">
                    Intermediário - R$40 (6 meses)
                </option>

                <option value="premium">
                    Premium - R$60 (12 meses)
                </option>

            </select>

            <br><br>

            <button
                class="btn"
                type="submit"
            >
                Realizar Matrícula
            </button>

        </form>

    </div>

</div>

<footer class="rodape">

    <p>
        &copy; 2026 BioMentoria - Plataforma de Biologia
    </p>

</footer>

</body>

</html>
