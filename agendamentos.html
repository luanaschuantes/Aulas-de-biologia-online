<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="estilo.css">

    <title>BioMentoria - Conteúdos</title>

</head>

<body>

<nav>

    <a href="index.html">Início</a>

    <a href="clientes.html">Matrícula</a>

    <a href="servicos.html">Planos</a>

    <a href="agendamentos.html">Conteúdos</a>

    <a href="consulta_agendamentos.html">Contato</a>

</nav>


<header class="banner">

    <h1>Conteúdos de Biologia</h1>

    <p>
        Visualize as aulas disponíveis de acordo com seu plano
    </p>

</header>


<div class="container">


    <!-- INFORMAÇÕES DO ALUNO -->

    <div class="card">

        <h2>Informações do Aluno</h2>

        <label>Aluno:</label>

        <p id="nomeAluno">
            Carregando...
        </p>


        <label>Plano Contratado:</label>

        <p id="planoAluno">
            Carregando...
        </p>

    </div>



    <!-- CONTEÚDOS -->

    <div class="card">

        <h2>Conteúdos Disponíveis</h2>

        <table>

            <thead>

                <tr>

                    <th>Aula</th>

                    <th>Nível</th>

                    <th>Acesso</th>

                </tr>

            </thead>


            <tbody id="lista-servicos-agendados">

            </tbody>

        </table>


        <div style="text-align:right; margin-top:15px;">

            <h3 id="totalAulas">
                Total de Aulas: 0
            </h3>

        </div>

    </div>


</div>


<footer class="rodape">

    <p>
        &copy; 2026 BioMentoria - Plataforma de Biologia
    </p>

</footer>


<script>


// Pega o ID do aluno enviado pelo servidor

const parametros =
    new URLSearchParams(window.location.search);

const alunoId =
    parametros.get('aluno_id');


// ============================================================
// CARREGAR ALUNO
// ============================================================

function carregarAluno() {

    if (!alunoId) {

        document.getElementById('nomeAluno').textContent =
            'Nenhum aluno selecionado';

        document.getElementById('planoAluno').textContent =
            '-';

        return;

    }


    fetch('/aluno/' + alunoId)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    'Aluno não encontrado'
                );

            }

            return response.json();

        })

        .then(aluno => {

            document.getElementById('nomeAluno').textContent =
                aluno.nome;

            document.getElementById('planoAluno').textContent =
                formatarPlano(aluno.plano);

            carregarConteudos(aluno.plano);

        })

        .catch(error => {

            console.error(error);

            document.getElementById('nomeAluno').textContent =
                'Aluno não encontrado';

            document.getElementById('planoAluno').textContent =
                '-';

        });

}


// ============================================================
// FORMATAR PLANO
// ============================================================

function formatarPlano(plano) {

    if (!plano) {
        return 'Não informado';
    }


    if (plano.toLowerCase() === 'basico') {
        return 'Básico - R$20 (3 meses)';
    }


    if (plano.toLowerCase() === 'intermediario') {
        return 'Intermediário - R$40 (6 meses)';
    }


    if (plano.toLowerCase() === 'premium') {
        return 'Premium - R$60 (12 meses)';
    }


    return plano;

}


// ============================================================
// CARREGAR CONTEÚDOS
// ============================================================

function carregarConteudos(plano) {

    const tabela =
        document.getElementById(
            'lista-servicos-agendados'
        );


    tabela.innerHTML = '';


    let aulas = [];


    // PLANO BÁSICO

    if (plano === 'basico') {

        aulas = [

            ['Introdução à Biologia', 'Básico'],

            ['Citologia', 'Básico'],

            ['Água e Sais Minerais', 'Básico'],

            ['Organelas Celulares', 'Básico']

        ];

    }


    // PLANO INTERMEDIÁRIO

    else if (plano === 'intermediario') {

        aulas = [

            ['Introdução à Biologia', 'Básico'],

            ['Citologia', 'Básico'],

            ['Água e Sais Minerais', 'Básico'],

            ['Organelas Celulares', 'Básico'],

            ['Histologia', 'Intermediário'],

            ['Genética', 'Intermediário'],

            ['Ecologia', 'Intermediário']

        ];

    }


    // PLANO PREMIUM

    else if (plano === 'premium') {

        aulas = [

            ['Introdução à Biologia', 'Básico'],

            ['Citologia', 'Básico'],

            ['Água e Sais Minerais', 'Básico'],

            ['Organelas Celulares', 'Básico'],

            ['Histologia', 'Intermediário'],

            ['Genética', 'Intermediário'],

            ['Ecologia', 'Intermediário'],

            ['Fisiologia Humana', 'Avançado'],

            ['Biotecnologia', 'Avançado'],

            ['Botânica Completa', 'Avançado'],

            ['Zoologia Completa', 'Avançado'],

            ['Preparação ENEM', 'Premium']

        ];

    }


    // MOSTRAR AULAS

    aulas.forEach(aula => {

        tabela.innerHTML += `

            <tr>

                <td>
                    ${aula[0]}
                </td>

                <td>
                    ${aula[1]}
                </td>

                <td>
                    Liberado
                </td>

            </tr>

        `;

    });


    document.getElementById('totalAulas').textContent =
        'Total de Aulas: ' + aulas.length;

}


// ============================================================
// INICIAR
// ============================================================

window.onload = function () {

    carregarAluno();

};


</script>


</body>

</html>
