<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>BioMentoria - Entrar</title>
    <style>
        /* Remove qualquer caixa/card nesta página */
        body.pagina-login .container .card,
        body.pagina-login .card {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .login-area {
            max-width: 380px;
            margin: 12px auto 56px;
            padding: 0 12px;
        }

        .login-area h2 {
            text-align: center;
            color: #06402f;
            font-size: 1.45rem;
            font-weight: 700;
            margin: 0 0 8px;
        }

        .login-area .subtitulo {
            text-align: center;
            color: #5a6b62;
            font-size: 0.98rem;
            margin: 0 0 36px;
            line-height: 1.5;
        }

        .login-area label {
            display: block;
            font-weight: 600;
            color: #06402f;
            font-size: 0.9rem;
            margin-bottom: 7px;
        }

        .login-area input[type="email"],
        .login-area input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            margin-bottom: 22px;
            border: 1.5px solid #b8d0c4;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            color: #2d3a34;
            background: transparent;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .login-area input:focus {
            border-color: #0a6b48;
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 0 0 3px rgba(10, 107, 72, 0.12);
        }

        .login-area .btn-entrar {
            width: 100%;
            padding: 14px 20px;
            margin-top: 4px;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .login-extra {
            text-align: center;
            margin-top: 40px;
            padding-top: 28px;
            border-top: 1px solid #c5d9ce;
        }

        .login-extra p {
            color: #5a6b62;
            font-size: 0.95rem;
            margin-bottom: 14px;
        }

        .login-extra .btn {
            display: inline-block;
            min-width: 170px;
        }
    </style>
</head>
<body class="pagina-login">

<nav>
    <a href="index.html">Início</a>
    <a href="clientes.html">Criar conta</a>
    <a href="login.html">Entrar</a>
    <a href="agendamentos.html">Fazer aulas</a>
    <a href="aulas-particulares.html">Aulas particulares</a>
    <a href="consulta_agendamentos.html">Contato</a>
    <a href="/logout" onclick="return confirm('Tem certeza que deseja fechar a sessão?')">Fechar sessão</a>
</nav>

<section class="banner">
    <h1>Entrar</h1>
    <p>Acesse sua conta para estudar gratuitamente</p>
</section>

<main class="container">
    <div class="login-area">
        <h2>Acesse sua conta</h2>
        <p class="subtitulo">Digite o e-mail e a senha cadastrados na BioMentoria.</p>

        <form action="/login" method="POST" autocomplete="on">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com" autocomplete="email">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required placeholder="Sua senha" autocomplete="current-password">

            <button type="submit" class="btn btn-entrar">Entrar</button>
        </form>

        <div class="login-extra">
            <p>Ainda não tem uma conta?</p>
            <a href="clientes.html" class="btn">Criar conta gratuita</a>
        </div>
    </div>
</main>

<footer class="rodape">
    <p>&copy; 2026 BioMentoria - Plataforma de Biologia</p>
</footer>

</body>
</html>
