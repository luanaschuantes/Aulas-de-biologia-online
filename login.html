<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>BioMentoria - Entrar</title>
    <style>
        .login-wrap {
            max-width: 400px;
            margin: 8px auto 48px;
            padding: 0 8px;
        }
        .login-wrap h2 {
            text-align: center;
            color: #06402f;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .login-sub {
            text-align: center;
            color: #5a6b62;
            font-size: 0.98rem;
            margin-bottom: 32px;
        }
        .login-wrap label {
            display: block;
            font-weight: 600;
            color: #06402f;
            font-size: 0.92rem;
            margin-bottom: 6px;
        }
        .login-wrap input[type="email"],
        .login-wrap input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #c5d9ce;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            color: #2d3a34;
            background: #ffffff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 20px;
            outline: none;
        }
        .login-wrap input:focus {
            border-color: #0a6b48;
            box-shadow: 0 0 0 3px rgba(10, 107, 72, 0.12);
        }
        .login-wrap .btn-entrar {
            width: 100%;
            margin-top: 4px;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            border-radius: 12px;
        }
        .login-footer-links {
            text-align: center;
            margin-top: 36px;
            padding-top: 28px;
            border-top: 1px solid #d4e5db;
        }
        .login-footer-links p {
            color: #5a6b62;
            font-size: 0.95rem;
            margin-bottom: 14px;
        }
        .login-footer-links .btn {
            display: inline-block;
            min-width: 150px;
        }
    </style>
</head>
<body class="pagina-login">

<nav>
    <a href="index.html">Início</a>
    <a href="clientes.html">Criar conta</a>
    <a href="login.html">Entrar</a>
    <a href="agendamentos.html">Fazer aulas</a>
    <a href="aulas-particulares.html">Aulas particulares</a>
    <a href="consulta_agendamentos.html">Contato</a>
    <a href="/logout" onclick="return confirm('Tem certeza que deseja fechar a sessão?')">Fechar sessão</a>
</nav>

<section class="banner">
    <h1>Entrar</h1>
    <p>Acesse sua conta para estudar gratuitamente</p>
</section>

<main class="container">
    <div class="login-wrap">
        <h2>Acesse sua conta</h2>
        <p class="login-sub">Use o e-mail e a senha cadastrados na BioMentoria.</p>

        <form action="/login" method="POST">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com" autocomplete="email">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required placeholder="Sua senha" autocomplete="current-password">

            <button type="submit" class="btn btn-entrar">Entrar</button>
        </form>

        <div class="login-footer-links">
            <p>Ainda não tem uma conta?</p>
            <a href="clientes.html" class="btn">Criar conta gratuita</a>
        </div>
    </div>
</main>

<footer class="rodape">
    <p>&copy; 2026 BioMentoria - Plataforma de Biologia</p>
</footer>

</body>
</html>
